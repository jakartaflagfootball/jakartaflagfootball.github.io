<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POTW Winners — JFF</title>
<meta name="robots" content="noindex">
<link rel="icon" href="jff-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="index.html">
    <img src="jff-logo.png" alt="JFF">
    <div class="nav-logo-text">JFF Stats<span>Winners</span></div>
  </a>
  <div class="nav-links"><a href="index.html">Voting page</a></div>
</nav>

<header class="page-header">
  <div class="container">
    <div class="eyebrow" id="seasonLabel">Open SZN IV</div>
    <h1 class="page-title"><span class="title-kicker">People's Choice</span>Player of the Week <span>Winners</span></h1>
    <p class="page-sub">Full-quality photos of each week's top players, for JFF's designers. Download links work for an hour.</p>
  </div>
</header>

<main class="container" style="padding:2rem 16px 4rem;max-width:1000px">
  <div id="demoBanner"></div>
  <div id="gate"></div>
  <div id="body" style="display:none">
    <div class="win-bar">
      <select class="week-select" id="weekSelect" aria-label="Choose week"></select>
      <select class="filter-select" id="topSelect" aria-label="How many per category">
        <option value="1">Winners only</option>
        <option value="3" selected>Top 3</option>
      </select>
      <button class="btn-primary" id="zipBtn" type="button">Download all (.zip)</button>
    </div>
    <div id="liveNote"></div>
    <div id="winners"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="jff-auth.js"></script>
<script src="roster.js"></script>
<script src="api.js"></script>
<script src="winners.js"></script>
</body>
</html>
